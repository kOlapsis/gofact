# GoReleaser — binaires statiques, un fichier par plateforme, aucune dépendance
# d'exécution hors navigateur. `goreleaser release --clean` sur un tag.
version: 2

project_name: gofact

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, .env.example]

# Distribution par gestionnaire de paquets. Les deux dépôts sont des dépôts
# personnels : ni Homebrew core ni le bucket Scoop principal n'accepte un projet
# sous leur seuil de notoriété, et les attendre reviendrait à laisser les
# utilisateurs macOS et Windows installer à la main.
#
# Le jeton n'est pas GITHUB_TOKEN : celui de la release n'écrit que dans ce
# dépôt. Sans jeton dédié, la formule et le manifeste sont produits mais pas
# poussés — la release aboutit quand même.
homebrew_casks:
  - name: gofact
    binaries: [gofact]
    repository:
      owner: kOlapsis
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://kolapsis.github.io/gofact/"
    description: "Compliant French e-invoicing: HTML to Factur-X (PDF/A-3 + EN 16931 CII XML), locally"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "gofact {{ .Tag }}"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    caveats: |
      gofact a besoin d'un navigateur Chrome pour le rendu PDF. S'il n'est pas
      détecté, indiquez son chemin dans GOFACT_CHROME.

      Pour déclarer le serveur MCP à votre client IA : gofact install
    # Le binaire n'est pas signé ni notarisé : sans cela, macOS le met en
    # quarantaine et affiche « l'application est endommagée ».
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gofact"]
          end

scoops:
  - name: gofact
    repository:
      owner: kOlapsis
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://kolapsis.github.io/gofact/"
    description: "Compliant French e-invoicing: HTML to Factur-X (PDF/A-3 + EN 16931 CII XML), locally"
    license: AGPL-3.0-or-later
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "gofact {{ .Tag }}"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: Nouveautés
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Corrections
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Autres changements
      order: 999

release:
  name_template: "gofact {{ .Tag }}"
  header: |
    Factur-X conforme en local : PDF/A-3 avec le XML CII EN 16931 embarqué octet
    pour octet. Un binaire, un navigateur, aucun abonnement.

    ### Installation

    ```sh
    # Linux, macOS
    curl -fsSL https://raw.githubusercontent.com/kOlapsis/gofact/main/install.sh | sh
    ```

    ```powershell
    # Windows
    irm https://raw.githubusercontent.com/kOlapsis/gofact/main/install.ps1 | iex
    ```

    Puis `gofact install` pour déclarer le serveur MCP à votre client IA.
    Le [guide de démarrage](https://kolapsis.github.io/gofact/demarrage/) mène à
    la première facture.

    ---
  footer: |

    ---

    **gofact n'est pas une plateforme agréée.** Il produit le fichier Factur-X ;
    votre plateforme agréée le transporte jusqu'à votre client et à
    l'administration.

    Documentation : <https://kolapsis.github.io/gofact/> ·
    Un problème, une question : [ouvrez une issue](https://github.com/kOlapsis/gofact/issues/new)
