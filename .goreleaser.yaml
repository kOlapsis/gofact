# GoReleaser — binaires statiques, un fichier par plateforme, aucune dépendance
# d'exécution hors navigateur. `goreleaser release --clean` sur un tag.
version: 2

project_name: gofact

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, .env.example]

checksum:
  name_template: checksums.txt

changelog:
  use: git
