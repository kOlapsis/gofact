name: Release

on:
  push:
    tags: ["v*"]
  # Déclenchement manuel : publier ne doit pas exiger un poste capable de
  # pousser un tag. Le tag est posé par le job lui-même, sur le commit courant
  # de la branche choisie.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier, préfixée par v (ex. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Une release ne part jamais d'un commit rouge. Un tag ne déclenche pas
  # `workflow_run`, et `ci.yml` ne tourne pas sur les tags : on ne peut donc pas
  # dépendre du workflow, seulement interroger son résultat sur le commit à
  # publier — celui que goreleaser va construire.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: CI verte sur le commit à publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
                   --jq '[.workflow_runs[] | {status, conclusion}]')
          total=$(jq 'length' <<<"$runs")
          ok=$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")

          if [ "$ok" -gt 0 ]; then
            echo "CI verte sur $SHA"
            exit 0
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::aucun run de ci.yml sur $SHA — pousser le commit sur une branche" \
                 "couverte par la CI et attendre qu'elle passe avant de publier"
          elif [ "$pending" -gt 0 ]; then
            echo "::error::la CI tourne encore sur $SHA — relancer cette release quand elle est verte"
          else
            echo "::error::la CI a échoué sur $SHA — corriger avant de publier"
          fi
          exit 1

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # goreleaser exige que le commit construit porte un tag. En déclenchement
      # manuel il n'existe pas encore : on le crée ici, après avoir vérifié sa
      # forme et son unicité — un tag de version ne se réécrit pas.
      #
      # Le push utilise le GITHUB_TOKEN par défaut, dont les événements ne
      # déclenchent aucun workflow : le `push: tags` ci-dessus ne se rallumera
      # donc pas, et la release ne peut pas partir deux fois.
      - name: Poser le tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::le tag doit commencer par v suivi d'un chiffre (reçu : $TAG)"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::le tag $TAG existe déjà"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "gofact ${TAG#v}"
          git push origin "refs/tags/$TAG"
          echo "tag $TAG posé sur $(git rev-parse --short HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Écrit dans homebrew-tap et scoop-bucket, que GITHUB_TOKEN n'atteint
          # pas. Absent, la formule et le manifeste sont produits sans être
          # poussés : la release aboutit quand même.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Registre officiel MCP. gofact n'étant dans aucun registre de paquets, la
      # seule voie est le type `mcpb` : un bundle par plateforme, hébergé sur la
      # release GitHub — hébergeur autorisé par le registre.
      - name: Bundles .mcpb
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/mcpb.sh dist "${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Joindre les bundles à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/mcpb/*.mcpb --clobber

  # Publication au registre MCP : un workflow à part, rejouable seul si elle rate.
  registry:
    needs: release
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write
