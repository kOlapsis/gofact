name: Registre MCP

# Publication au registre officiel MCP, séparée de la release pour être
# rejouable : les bundles sont lus sur la release publiée, pas reconstruits.
# Une publication ratée se relance seule, sans refaire de version.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Version déjà publiée à soumettre (ex. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # authentification OIDC auprès du registre

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Récupérer les bundles de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download "$TAG" --pattern '*.mcpb' --dir bundles
          ls -1 bundles

      - name: Renseigner server.json
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/server-json.sh "$TAG" bundles

      # Le namespace io.github.kOlapsis/* est prouvé par le dépôt lui-même :
      # aucun secret à stocker. Attention, il est sensible à la casse.
      - name: Publier
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Vérifier la fiche publiée
        run: |
          set -euo pipefail
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.kOlapsis/gofact" | jq .
